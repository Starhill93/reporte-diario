<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte diario · INABIF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<style>
  :root { --rojo: #B51F35; --navy: #0A3A70; --texto: #45536D; --gris: #8A94A6; --linea: #E6EAF0; --fondo: #F0F3F7; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Open Sans", Arial, sans-serif; color: var(--texto); background: var(--fondo); }
  .barra { background: var(--rojo); color: #fff; padding: 14px 20px; font-weight: 700; font-size: 18px; }
  main { max-width: 760px; margin: 28px auto; padding: 0 16px; }
  .tarjeta { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  h2 { margin: 0 0 10px; font-size: 15px; color: var(--navy); }
  .zona { display: block; border: 2px dashed var(--gris); border-radius: 10px; padding: 34px 16px; text-align: center; cursor: pointer; }
  .zona.sobre { border-color: var(--rojo); background: #fdf3f4; }
  .zona-titulo { font-size: 18px; font-weight: 700; color: var(--navy); }
  .zona-sub, .nota { font-size: 13px; color: var(--gris); margin-top: 6px; }
  .fila { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--linea); font-size: 14px; }
  .fila:last-child { border-bottom: 0; }
  .ok { color: #2E7D6E; font-weight: 600; } .mal { color: var(--rojo); font-weight: 600; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 8px; padding: 12px 22px; cursor: pointer; background: var(--rojo); color: #fff; font-size: 16px; }
  button:disabled { background: var(--gris); cursor: default; }
  .avisos { color: #8a5a00; font-size: 13px; margin: 8px 0 0; padding-left: 18px; }
  .estado { min-height: 20px; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<header class="barra">Reporte diario de ejecución · INABIF</header>
<main>
  <section class="tarjeta">
    <h2>1 · Excel del SIAF del día</h2>
    <label class="zona" id="zona">
      <input type="file" id="archivo" accept=".xlsx,.xlsm,.xls" hidden>
      <div class="zona-titulo" id="zonaTitulo">Arrastra aquí el ReporteGasto (.xlsx)</div>
      <div class="zona-sub">o haz clic para elegirlo · el que trae UNIDAD FUNCIONAL y CONDICION 2</div>
    </label>
    <p class="nota">El archivo se procesa en tu navegador. No se sube a ningún servidor.</p>
    <ul class="avisos" id="avisos" hidden></ul>
  </section>

  <section class="tarjeta">
    <h2>2 · Datos</h2>
    <div class="fila"><span>Excel SIAF (láminas de unidades y FEN)</span><span id="estExcel" class="mal">falta cargar</span></div>
    <div class="fila"><span>Consulta Amigable (MIMP, ordinario/FEN, histórico)</span><span id="estCA">cargando…</span></div>
  </section>

  <section class="tarjeta">
    <h2>3 · Presentación</h2>
    <button id="btnPptx" type="button" disabled>Descargar PPTX</button>
    <div class="estado" id="estado" role="status"></div>
  </section>
</main>

<script src="lib/xlsx.full.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="lib/pptxgen.bundle.js"></script>
<script src="app.js"></script>
<script>
(() => {
  const R = window.ReporteDiario, $ = id => document.getElementById(id);
  let EX = null, CA = null, FECHA = null;

  const listo = () => { $("btnPptx").disabled = !EX; };

  fetch("datos/consulta_amigable.json?t=" + Date.now(), { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      CA = d;
      const c = new Date(d.consultado);
      const horas = (Date.now() - c) / 36e5;
      $("estCA").textContent = `consultado el ${R.fechaTxt(c)} ${String(c.getHours()).padStart(2, "0")}:${String(c.getMinutes()).padStart(2, "0")}`;
      $("estCA").className = horas < 24 ? "ok" : "mal";
    })
    .catch(() => { $("estCA").textContent = "no disponible (se omiten las láminas 2 a 5)"; $("estCA").className = "mal"; });

  async function cargar(file) {
    $("estExcel").textContent = "leyendo…"; $("estExcel").className = "";
    $("avisos").hidden = true;
    await new Promise(r => setTimeout(r, 30));
    try {
      EX = R.leerExcel(await file.arrayBuffer());
      FECHA = EX.fecha || new Date();
      $("zonaTitulo").textContent = file.name;
      $("estExcel").textContent = `${EX.unidades.size} unidades · fecha ${R.fechaTxt(FECHA)}`;
      $("estExcel").className = "ok";
      if (EX.avisos.length) { $("avisos").innerHTML = EX.avisos.map(a => `<li>${a}</li>`).join(""); $("avisos").hidden = false; }
    } catch (e) {
      console.error(e); EX = null;
      $("estExcel").textContent = e.message || "No se pudo leer el archivo"; $("estExcel").className = "mal";
    }
    listo();
  }

  $("archivo").addEventListener("change", e => { const f = e.target.files[0]; if (f) cargar(f); e.target.value = ""; });
  const zona = $("zona");
  ["dragenter", "dragover"].forEach(ev => zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.add("sobre"); }));
  ["dragleave", "drop"].forEach(ev => zona.addEventListener(ev, () => zona.classList.remove("sobre")));
  window.addEventListener("dragover", e => e.preventDefault());
  window.addEventListener("drop", e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) cargar(f); });

  $("btnPptx").addEventListener("click", async () => {
    const b = $("btnPptx");
    b.disabled = true; b.textContent = "Generando…"; $("estado").textContent = "";
    try {
      const blob = await R.generar(EX, CA, FECHA);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = R.nombreArchivo(FECHA);
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      $("estado").textContent = "Listo: " + a.download;
    } catch (e) {
      console.error(e);
      $("estado").textContent = "No se pudo generar: " + (e.message || e);
    } finally {
      b.textContent = "Descargar PPTX"; listo();
    }
  });
})();
</script>
</body>
</html>
